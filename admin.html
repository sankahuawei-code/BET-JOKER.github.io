<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - JOKER ANALYSIS</title>

<style>
body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
}
main{
  max-width:800px;
  margin:auto;
  padding:25px 15px;
}
h1,h2{color:#39ff14}
.card{
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
}
input,textarea,select{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:7px 0 14px;
  background:#080808;
  color:white;
  border:1px solid #444;
  border-radius:7px;
}
textarea{min-height:150px}
button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:7px;
  background:#39ff14;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
.danger{background:#b00020;color:white}
.hidden{display:none}
.message{margin-top:12px}
.error{color:#ff4444}
.success{color:#39ff14}
.post{
  border-top:1px solid #333;
  padding:15px 0;
}
small{color:#888}
a{color:#39ff14}
</style>
</head>

<body>
<main>

<h1>JOKER ANALYSIS — ADMIN</h1>

<div id="login" class="card">
<h2>Connexion</h2>

<label>Email</label>
<input id="email" type="email" placeholder="Ton adresse e-mail">

<label>Mot de passe</label>
<input id="password" type="password" placeholder="Ton mot de passe">

<button id="loginBtn">SE CONNECTER</button>

<p id="loginMsg" class="message"></p>
</div>


<div id="admin" class="hidden">

<div class="card">
<h2>Publier une analyse</h2>

<label>Sport</label>
<input id="sport" placeholder="Football">

<label>Match / événement</label>
<input id="match" placeholder="Marseille - Lyon">

<label>Titre</label>
<input id="title" placeholder="Titre de l'analyse">

<label>Date</label>
<input id="date" type="date">

<label>Confiance</label>
<input id="confidence" placeholder="Élevée">

<label>Catégorie</label>
<select id="category">
<option>ANALYSE</option>
<option>STATISTIQUES</option>
<option>ACTUALITÉ</option>
</select>

<label>Analyse</label>
<textarea id="analysis" placeholder="Écris ton analyse ici..."></textarea>

<button id="publishBtn">PUBLIER L'ANALYSE</button>

<p id="publishMsg" class="message"></p>
</div>


<div class="card">
<h2>Analyses publiées</h2>
<div id="posts">Chargement...</div>
</div>


<div class="card">
<button id="logoutBtn" class="danger">SE DÉCONNECTER</button>
</div>

</div>

<p><a href="index.html">← Retour au site</a></p>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

const db = supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_ANON_KEY
);

const login = document.getElementById("login");
const admin = document.getElementById("admin");

document.getElementById("loginBtn").onclick = async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    document.getElementById("loginMsg").textContent =
      "Entre ton email et ton mot de passe.";
    document.getElementById("loginMsg").className = "message error";
    return;
  }

  const {error} = await db.auth.signInWithPassword({
    email: email,
    password: password
  });

  if(error){
    document.getElementById("loginMsg").textContent =
      "Erreur : " + error.message;
    document.getElementById("loginMsg").className = "message error";
    return;
  }

  login.classList.add("hidden");
  admin.classList.remove("hidden");
  loadPosts();
};


document.getElementById("publishBtn").onclick = async () => {

  const data = {
    sport: document.getElementById("sport").value.trim(),
    match: document.getElementById("match").value.trim(),
    title: document.getElementById("title").value.trim() || null,
    date: document.getElementById("date").value || null,
    confidence: document.getElementById("confidence").value.trim() || null,
    category: document.getElementById("category").value,
    analysis: document.getElementById("analysis").value.trim(),
    result: "pending"
  };

  if(!data.sport || !data.match || !data.analysis){
    document.getElementById("publishMsg").textContent =
      "Sport, match et analyse sont obligatoires.";
    document.getElementById("publishMsg").className = "message error";
    return;
  }
const {data: userData} = await db.auth.getUser();
console.log("UTILISATEUR CONNECTÉ :", userData.user);
  const {error} = await db.from("posts").insert(data);

  if(error){
    document.getElementById("publishMsg").textContent =
      "Erreur : " + error.message;
    document.getElementById("publishMsg").className = "message error";
    return;
  }

  document.getElementById("publishMsg").textContent =
    "Analyse publiée !";
  document.getElementById("publishMsg").className = "message success";

  document.getElementById("analysis").value = "";

  loadPosts();
};


async function loadPosts(){

  const {data,error} = await db
    .from("posts")
    .select("*")
    .order("created_at",{ascending:false});

  const box = document.getElementById("posts");

  if(error){
    box.innerHTML = "<p class='error'>" + error.message + "</p>";
    return;
  }

  if(!data.length){
    box.innerHTML = "<small>Aucune analyse publiée.</small>";
    return;
  }

  box.innerHTML = "";

  data.forEach(post => {

    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      <h3>${post.title || "Analyse sportive"}</h3>
      <small>${post.sport} — ${post.match}</small>
      <p>${post.analysis}</p>
      <button class="danger">SUPPRIMER</button>
    `;

    div.querySelector("button").onclick = async () => {

      if(!confirm("Supprimer cette analyse ?")) return;

      await db.from("posts").delete().eq("id",post.id);

      loadPosts();
    };

    box.appendChild(div);
  });
}


document.getElementById("logoutBtn").onclick = async () => {

  await db.auth.signOut();

  admin.classList.add("hidden");
  login.classList.remove("hidden");
};


async function checkSession(){

  const {data} = await db.auth.getSession();

  if(data.session){
    login.classList.add("hidden");
    admin.classList.remove("hidden");
    loadPosts();
  }
}

checkSession();

</script>

</body>
</html>
