<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BETJOKER — Administration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 30px 15px;
      border-bottom: 1px solid rgba(57, 255, 20, 0.25);
    }

    .logo {
      color: #39ff14;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow:
        0 0 5px #39ff14,
        0 0 15px rgba(57, 255, 20, 0.5);
    }

    .subtitle {
      color: #888;
      font-size: 12px;
      margin-top: 7px;
    }

    main {
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 25px 15px 50px;
    }

    .card {
      background: #0b0b0b;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 22px;
      margin-bottom: 20px;
    }

    h2 {
      color: #39ff14;
      font-size: 18px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 12px;
      margin-bottom: 6px;
      margin-top: 15px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px;
      background: #111;
      color: white;
      border: 1px solid #292929;
      border-radius: 5px;
      outline: none;
      font-family: Arial, Helvetica, sans-serif;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #39ff14;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    select {
      cursor: pointer;
    }

    option {
      background: #111;
      color: white;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .main-button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: #39ff14;
      color: #000;
      border-radius: 6px;
      font-size: 13px;
    }

    .main-button:hover {
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
    }

    .logout {
      background: transparent;
      border: 1px solid #333;
      color: #aaa;
      padding: 9px 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    .logout:hover {
      color: #39ff14;
      border-color: #39ff14;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
      display: none;
    }

    .success {
      display: block;
      color: #39ff14;
      border: 1px solid rgba(57, 255, 20, 0.3);
      background: rgba(57, 255, 20, 0.05);
    }

    .error {
      display: block;
      color: #ff5555;
      border: 1px solid rgba(255, 85, 85, 0.3);
      background: rgba(255, 85, 85, 0.05);
    }

    /* ANALYSES EXISTANTES */

    .post-admin {
      background: #0d0d0d;
      border: 1px solid #222;
      border-left: 3px solid #39ff14;
      border-radius: 7px;
      padding: 17px;
      margin-bottom: 12px;
    }

    .post-admin h3 {
      font-size: 16px;
      margin-bottom: 7px;
    }

    .post-meta {
      color: #777;
      font-size: 11px;
      margin-bottom: 12px;
    }

    .post-preview {
      color: #bbb;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .status-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .status-line label {
      margin: 0;
      width: auto;
    }

    .status-select {
      width: auto;
      min-width: 220px;
      padding: 8px;
    }

    .update-button {
      padding: 9px 13px;
      background: #39ff14;
      color: #000;
      border-radius: 5px;
      font-size: 11px;
    }

    .delete-button {
      margin-top: 12px;
      padding: 9px 13px;
      background: transparent;
      color: #ff5555;
      border: 1px solid rgba(255, 85, 85, 0.35);
      border-radius: 5px;
      font-size: 11px;
    }

    .delete-button:hover {
      background: rgba(255, 85, 85, 0.08);
    }

    .status {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .status-pending {
      color: #aaa;
      border: 1px solid #333;
    }

    .status-win {
      color: #39ff14;
      border: 1px solid rgba(57, 255, 20, 0.4);
    }

    .status-loss {
      color: #ff5555;
      border: 1px solid rgba(255, 85, 85, 0.4);
    }

    .hidden {
      display: none;
    }

    .back-link {
      display: inline-block;
      color: #777;
      text-decoration: none;
      font-size: 12px;
      margin-top: 5px;
    }

    .back-link:hover {
      color: #39ff14;
    }

    @media (max-width: 600px) {

      .logo {
        font-size: 28px;
      }

      .card {
        padding: 17px;
      }

      .status-select {
        width: 100%;
      }

      .update-button {
        width: 100%;
      }
    }
  </style>
</head>


<body>

  <header>
    <div class="logo">BETJOKER ADMIN</div>
    <div class="subtitle">
      Gestion des analyses sportives
    </div>
  </header>


  <main>

    <!-- =========================
         CONNEXION
    ========================== -->

    <div id="loginCard" class="card">

      <h2>🔐 Connexion</h2>

      <label for="email">
        Adresse e-mail
      </label>

      <input
        type="email"
        id="email"
        placeholder="Votre adresse e-mail"
      >


      <label for="password">
        Mot de passe
      </label>

      <input
        type="password"
        id="password"
        placeholder="Votre mot de passe"
      >


      <button
        class="main-button"
        id="loginButton">
        SE CONNECTER
      </button>


      <div
        id="loginMessage"
        class="message">
      </div>

    </div>


    <!-- =========================
         ESPACE ADMIN
    ========================== -->

    <div
      id="adminArea"
      class="hidden">

      <button
        class="logout"
        id="logoutButton">
        SE DÉCONNECTER
      </button>


      <!-- =========================
           NOUVELLE ANALYSE
      ========================== -->

      <div class="card">

        <h2>
          ➕ Nouvelle analyse
        </h2>


        <label for="sport">
          Sport
        </label>

        <select id="sport">

          <option value="Football">
            Football
          </option>

          <option value="Basketball">
            Basketball
          </option>

          <option value="Tennis">
            Tennis
          </option>

          <option value="Hockey">
            Hockey
          </option>

          <option value="Rugby">
            Rugby
          </option>

        </select>


        <label for="match">
          Match / événement
        </label>

        <input
          type="text"
          id="match"
          placeholder="Ex : Équipe A — Équipe B"
        >


        <label for="title">
          Titre
        </label>

        <input
          type="text"
          id="title"
          placeholder="Titre de l'analyse"
        >


        <label for="date">
          Date
        </label>

        <input
          type="date"
          id="date"
        >


        <label for="category">
          Catégorie
        </label>

        <input
          type="text"
          id="category"
          value="ANALYSE"
          placeholder="ANALYSE"
        >


        <label for="confidence">
          Niveau de confiance
        </label>

        <input
          type="text"
          id="confidence"
          placeholder="Ex : 🟢🟢🟢"
        >


        <label for="analysis">
          Analyse
        </label>

        <textarea
          id="analysis"
          placeholder="Écris ton analyse ici..."
        ></textarea>


        <!-- STATUT INITIAL -->

        <label for="initialStatus">
          Statut de l'analyse
        </label>

        <select id="initialStatus">

          <option value="pending">
            ⚪ Analyse en cours
          </option>

          <option value="win">
            🟢 Résultat confirmé
          </option>

          <option value="loss">
            🔴 Résultat non confirmé
          </option>

        </select>


        <button
          class="main-button"
          id="publishButton">
          PUBLIER L'ANALYSE
        </button>


        <div
          id="publishMessage"
          class="message">
        </div>

      </div>


      <!-- =========================
           ANALYSES PUBLIÉES
      ========================== -->

      <div class="card">

        <h2>
          📋 Analyses publiées
        </h2>

        <div id="postsList">
          Chargement...
        </div>

      </div>


      <a
        href="index.html"
        class="back-link">
        ← Retour au site
      </a>

    </div>

  </main>


  <script>

    const supabaseClient =
      window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
      );


    /* =========================
       ELEMENTS
    ========================== */

    const loginCard =
      document.getElementById("loginCard");

    const adminArea =
      document.getElementById("adminArea");

    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const publishButton =
      document.getElementById("publishButton");


    /* =========================
       MESSAGE
    ========================== */

    function showMessage(
      element,
      text,
      type
    ) {

      element.textContent = text;

      element.className =
        "message " + type;

    }


    /* =========================
       SECURITE HTML
    ========================== */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       STATUT
    ========================== */

    function statusLabel(status) {

      if (status === "win") {
        return "🟢 Résultat confirmé";
      }

      if (status === "loss") {
        return "🔴 Résultat non confirmé";
      }

      return "⚪ Analyse en cours";

    }


    function statusClass(status) {

      if (status === "win") {
        return "status-win";
      }

      if (status === "loss") {
        return "status-loss";
      }

      return "status-pending";

    }


    /* =========================
       CONNEXION
    ========================== */

    async function login() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        showMessage(
          document.getElementById("loginMessage"),
          "Remplis l'e-mail et le mot de passe.",
          "error"
        );

        return;
      }


      loginButton.disabled = true;

      loginButton.textContent =
        "CONNEXION...";


      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({
            email: email,
            password: password
          });


      loginButton.disabled = false;

      loginButton.textContent =
        "SE CONNECTER";


      if (error) {

        showMessage(
          document.getElementById("loginMessage"),
          error.message,
          "error"
        );

        return;
      }


      showAdmin();

    }


    loginButton.addEventListener(
      "click",
      login
    );


    /* =========================
       AFFICHER ADMIN
    ========================== */

    function showAdmin() {

      loginCard.classList.add("hidden");

      adminArea.classList.remove("hidden");

      loadPosts();

    }


    /* =========================
       VERIFIER SESSION
    ========================== */

    async function checkSession() {

      const {
        data
      } =
        await supabaseClient.auth
          .getSession();


      if (data.session) {
        showAdmin();
      }

    }


    checkSession();


    /* =========================
       DECONNEXION
    ========================== */

    logoutButton.addEventListener(
      "click",
      async () => {

        await supabaseClient.auth.signOut();

        adminArea.classList.add("hidden");

        loginCard.classList.remove("hidden");

      }
    );


    /* =========================
       PUBLICATION
    ========================== */

    publishButton.addEventListener(
      "click",
      publishPost
    );


    async function publishPost() {

      const sport =
        document.getElementById("sport").value;

      const match =
        document.getElementById("match").value.trim();

      const title =
        document.getElementById("title").value.trim();

      const date =
        document.getElementById("date").value;

      const category =
        document.getElementById("category").value.trim();

      const confidence =
        document.getElementById("confidence").value.trim();

      const analysis =
        document.getElementById("analysis").value.trim();

      const result =
        document.getElementById("initialStatus").value;


      if (!match || !analysis) {

        showMessage(
          document.getElementById("publishMessage"),
          "Le match et l'analyse sont obligatoires.",
          "error"
        );

        return;
      }


      publishButton.disabled = true;

      publishButton.textContent =
        "PUBLICATION...";


      const {
        error
      } =
        await supabaseClient
          .from("posts")
          .insert([{

            sport: sport,

            match: match,

            title: title || null,

            date: date || null,

            category: category || "ANALYSE",

            confidence: confidence || null,

            analysis: analysis,

            result: result

          }]);


      publishButton.disabled = false;

      publishButton.textContent =
        "PUBLIER L'ANALYSE";


      if (error) {

        console.error(error);

        showMessage(
          document.getElementById("publishMessage"),
          "Erreur : " + error.message,
          "error"
        );

        return;
      }


      showMessage(
        document.getElementById("publishMessage"),
        "Analyse publiée avec succès.",
        "success"
      );


      document.getElementById("match").value = "";

      document.getElementById("title").value = "";

      document.getElementById("date").value = "";

      document.getElementById("confidence").value = "";

      document.getElementById("analysis").value = "";

      document.getElementById("initialStatus").value =
        "pending";


      loadPosts();

    }


    /* =========================
       CHARGER LES ANALYSES
    ========================== */

    async function loadPosts() {

      const container =
        document.getElementById("postsList");


      container.innerHTML =
        "Chargement...";


      const {
        data,
        error
      } =
        await supabaseClient
          .from("posts")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(error);

        container.innerHTML =
          "Impossible de charger les analyses.";

        return;
      }


      if (!data || data.length === 0) {

        container.innerHTML =
          '<div style="color:#777;font-size:13px;">Aucune analyse publiée.</div>';

        return;
      }


      container.innerHTML =
        data.map(post => {

          const result =
            post.result || "pending";


          return `

            <div
              class="post-admin"
              data-id="${escapeHtml(post.id)}">

              <h3>
                ${escapeHtml(post.match)}
              </h3>


              <div class="post-meta">
                ${escapeHtml(post.sport)}
                ${post.date ? " • " + escapeHtml(post.date) : ""}
              </div>


              <div class="status ${statusClass(result)}">
                ${statusLabel(result)}
              </div>


              ${
                post.title
                  ? `
                    <div style="
                      color:#39ff14;
                      font-size:12px;
                      margin-bottom:8px;
                    ">
                      ${escapeHtml(post.title)}
                    </div>
                  `
                  : ""
              }


              <div class="post-preview">
                ${escapeHtml(post.analysis)}
              </div>


              <div class="status-line">

                <label>
                  Modifier le statut :
                </label>


                <select
                  class="status-select"
                  id="status-${escapeHtml(post.id)}">

                  <option
                    value="pending"
                    ${result === "pending" ? "selected" : ""}>
                    ⚪ Analyse en cours
                  </option>

                  <option
                    value="win"
                    ${result === "win" ? "selected" : ""}>
                    🟢 Résultat confirmé
                  </option>

                  <option
                    value="loss"
                    ${result === "loss" ? "selected" : ""}>
                    🔴 Résultat non confirmé
                  </option>

                </select>


                <button
                  class="update-button"
                  onclick="updateStatus('${escapeHtml(post.id)}')">

                  ENREGISTRER

                </button>

              </div>


              <button
                class="delete-button"
                onclick="deletePost('${escapeHtml(post.id)}')">

                🗑 SUPPRIMER

              </button>

            </div>

          `;

        }).join("");

    }


    /* =========================
       MODIFIER STATUT
    ========================== */

    async function updateStatus(id) {

      const select =
        document.getElementById(
          "status-" + id
        );


      if (!select) {
        return;
      }


      const newStatus =
        select.value;


      const {
        error
      } =
        await supabaseClient
          .from("posts")
          .update({
            result: newStatus
          })
          .eq("id", id);


      if (error) {

        console.error(error);

        alert(
          "Erreur lors de la modification : " +
          error.message
        );

        return;
      }


      alert(
        "Statut de l'analyse modifié."
      );


      loadPosts();

    }


    /* =========================
       SUPPRIMER
    ========================== */

    async function deletePost(id) {

      const confirmation =
        confirm(
          "Supprimer définitivement cette analyse ?"
        );


      if (!confirmation) {
        return;
      }


      const {
        error
      } =
        await supabaseClient
          .from("posts")
          .delete()
          .eq("id", id);


      if (error) {

        console.error(error);

        alert(
          "Erreur lors de la suppression : " +
          error.message
        );

        return;
      }


      loadPosts();

    }

  </script>

</body>
</htm
