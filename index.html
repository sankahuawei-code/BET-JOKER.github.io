<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BETJOKER — Analyses sportives</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #39ff14;
      --green-soft: rgba(57, 255, 20, 0.12);
      --black: #050505;
      --card: #0b0b0b;
      --border: #242424;
      --text: #ffffff;
      --muted: #8a8a8a;
    }

    body {
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(57,255,20,0.07),
          transparent 35%
        ),
        #050505;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    header {
      position: relative;
      text-align: center;
      padding: 34px 20px 25px;
      border-bottom: 1px solid rgba(57,255,20,0.22);
      background: rgba(5,5,5,0.96);
    }

    .menu-button {
      position: absolute;
      top: 17px;
      left: 18px;
      width: 40px;
      height: 40px;
      background: transparent;
      border: 1px solid #242424;
      border-radius: 8px;
      color: var(--green);
      font-size: 22px;
      cursor: pointer;
    }

    .menu-button:hover {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .admin-link {
      position: absolute;
      top: 27px;
      right: 18px;
      color: #666;
      text-decoration: none;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.2px;
    }

    .admin-link:hover {
      color: var(--green);
    }

    .logo {
      color: var(--green);
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 5px;
      text-shadow:
        0 0 6px var(--green),
        0 0 18px rgba(57,255,20,0.45);
    }

    .subtitle {
      margin-top: 8px;
      color: #999;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .sport-menu {
      display: none;
      position: absolute;
      z-index: 100;
      top: 65px;
      left: 15px;
      width: 225px;
      background: #0a0a0a;
      border: 1px solid var(--green);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(57,255,20,0.15);
    }

    .sport-menu.active {
      display: block;
    }

    .sport-menu button {
      width: 100%;
      padding: 14px 16px;
      border: 0;
      border-bottom: 1px solid #1b1b1b;
      background: transparent;
      color: #ccc;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
    }

    .sport-menu button:last-child {
      border-bottom: 0;
    }

    .sport-menu button:hover,
    .sport-menu button.active {
      color: var(--green);
      background: var(--green-soft);
    }

    main {
      width: 100%;
      max-width: 920px;
      margin: auto;
      padding: 32px 15px 60px;
    }

    .section-title {
      margin-bottom: 22px;
      color: var(--green);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .posts {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .post {
      position: relative;
      overflow: hidden;
      padding: 23px;
      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(57,255,20,0.08),
          transparent 32%
        ),
        linear-gradient(145deg, #101010, #070707);
      border: 1px solid #242424;
      border-left: 4px solid var(--green);
      border-radius: 18px;
      box-shadow:
        0 0 25px rgba(0,0,0,0.55),
        inset 0 0 30px rgba(57,255,20,0.025);
      transition: 0.25s ease;
    }

    .post:hover {
      transform: translateY(-2px);
      border-color: rgba(57,255,20,0.55);
      box-shadow:
        0 0 35px rgba(57,255,20,0.08),
        inset 0 0 30px rgba(57,255,20,0.04);
    }

    .post-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .sport {
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .date {
      color: #666;
      font-size: 10px;
      margin-top: 5px;
    }

    .result {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .result.pending {
      color: #fff;
      background: #171717;
      border: 1px solid #343434;
    }

    .result.win {
      color: var(--green);
      background: rgba(57,255,20,0.09);
      border: 1px solid rgba(57,255,20,0.35);
    }

    .result.loss {
      color: #ff5c5c;
      background: rgba(255,75,75,0.08);
      border: 1px solid rgba(255,75,75,0.35);
    }

    .match {
      margin: 25px 0 17px;
      text-align: center;
      font-size: clamp(24px, 5vw, 39px);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.7px;
    }

    .title {
      margin-bottom: 17px;
      color: var(--green);
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .badge {
      padding: 7px 10px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 7px;
      color: #999;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
