<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BETJOKER — Analyses sportives</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #39ff14;
      --green-soft: rgba(57, 255, 20, 0.12);
      --black: #050505;
      --card: #0b0b0b;
      --border: #242424;
      --text: #ffffff;
      --muted: #8a8a8a;
    }

    body {
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(57,255,20,0.07),
          transparent 35%
        ),
        #050505;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: relative;
      text-align: center;
      padding: 34px 20px 25px;
      border-bottom: 1px solid rgba(57,255,20,0.22);
      background: rgba(5,5,5,0.96);
    }

    .menu-button {
      position: absolute;
      top: 17px;
      left: 18px;
      width: 40px;
      height: 40px;
      background: transparent;
      border: 1px solid #242424;
      border-radius: 8px;
      color: var(--green);
      font-size: 22px;
      cursor: pointer;
    }

    .menu-button:hover {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .admin-link {
      position: absolute;
      top: 27px;
      right: 18px;
      color: #666;
      text-decoration: none;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.2px;
    }

    .admin-link:hover {
      color: var(--green);
    }

    .logo {
      color: var(--green);
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 5px;
      text-shadow:
        0 0 6px var(--green),
        0 0 18px rgba(57,255,20,0.45);
    }

    .subtitle {
      margin-top: 8px;
      color: #999;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* =========================
       MENU
    ========================= */

    .sport-menu {
      display: none;
      position: absolute;
      z-index: 100;
      top: 65px;
      left: 15px;
      width: 225px;
      background: #0a0a0a;
      border: 1px solid var(--green);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(57,255,20,0.15);
    }

    .sport-menu.active {
      display: block;
    }

    .sport-menu button {
      width: 100%;
      padding: 14px 16px;
      border: 0;
      border-bottom: 1px solid #1b1b1b;
      background: transparent;
      color: #ccc;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
    }

    .sport-menu button:last-child {
      border-bottom: 0;
    }

    .sport-menu button:hover,
    .sport-menu button.active {
      color: var(--green);
      background: var(--green-soft);
    }

    /* =========================
       CONTENU
    ========================= */

    main {
      width: 100%;
      max-width: 920px;
      margin: auto;
      padding: 32px 15px 60px;
    }

    .section-title {
      margin-bottom: 22px;
      color: var(--green);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .posts {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* =========================
       CARTE ANALYSE
    ========================= */

    .post {
      position: relative;
      overflow: hidden;
      padding: 23px;
      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(57,255,20,0.08),
          transparent 32%
        ),
        linear-gradient(145deg, #101010, #070707);
      border: 1px solid #242424;
      border-left: 4px solid var(--green);
      border-radius: 18px;
      box-shadow:
        0 0 25px rgba(0,0,0,0.55),
        inset 0 0 30px rgba(57,255,20,0.025);
      transition: 0.25s ease;
    }

    .post:hover {
      transform: translateY(-2px);
      border-color: rgba(57,255,20,0.55);
      box-shadow:
        0 0 35px rgba(57,255,20,0.08),
        inset 0 0 30px rgba(57,255,20,0.04);
    }

    /* =========================
       HAUT CARTE
    ========================= */

    .post-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .sport {
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .date {
      color: #666;
      font-size: 10px;
    }

    /* =========================
       STATUT
    ========================= */

    .result {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .result.pending {
      color: #fff;
      background: #171717;
      border: 1px solid #343434;
    }

    .result.win {
      color: var(--green);
      background: rgba(57,255,20,0.09);
      border: 1px solid rgba(57,255,20,0.35);
    }

    .result.loss {
      color: #ff5c5c;
      background: rgba(255,75,75,0.08);
      border: 1px solid rgba(255,75,75,0.35);
    }

    /* =========================
       MATCH
    ========================= */

    .match {
      margin: 25px 0 17px;
      text-align: center;
      font-size: clamp(24px, 5vw, 39px);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.7px;
    }

    /* =========================
       TITRE
    ========================= */

    .title {
      margin-bottom: 17px;
      color: var(--green);
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* =========================
       INFOS
    ========================= */

    .info {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .badge {
      padding: 7px 10px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 7px;
      color: #999;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* =========================
       STAT CLÉ
    ========================= */

    .key-stat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin: 20px 0;
      padding: 18px;
      background:
        linear-gradient(
          135deg,
          rgba(57,255,20,0.07),
          rgba(255,255,255,0.015)
        );
      border: 1px solid rgba(57,255,20,0.18);
      border-radius: 14px;
    }

    .key-stat-left {
      min-width: 0;
    }

    .key-stat-label {
      margin-bottom: 6px;
      color: #777;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .key-stat-player {
      color: #fff;
      font-size: 17px;
      font-weight: 900;
    }

    .key-stat-value {
      color: var(--green);
      font-size: 25px;
      font-weight: 900;
      white-space: nowrap;
      text-shadow: 0 0 10px rgba(57,255,20,0.25);
    }

    /* =========================
       CONFIANCE
    ========================= */

    .confidence-box {
      margin: 22px 0;
    }

    .confidence-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .confidence-label {
      color: #888;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .confidence-value {
      color: var(--green);
      font-size: 17px;
      font-weight: 900;
    }

    .confidence-bar {
      height: 8px;
      overflow: hidden;
      background: #181818;
      border-radius: 999px;
    }

    .confidence-fill {
      height: 100%;
      min-width: 0;
      background: var(--green);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(57,255,20,0.55);
    }

    /* =========================
       ANALYSE
    ========================= */

    .analysis-box {
      margin-top: 22px;
      padding: 18px;
      background: rgba(255,255,255,0.025);
      border: 1px solid #222;
      border-radius: 14px;
    }

    .analysis-label {
      margin-bottom: 11px;
      color: var(--green);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.2px;
    }

    .analysis {
      color: #ccc;
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-line;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      padding: 45px 15px;
      color: #777;
      text-align: center;
      font-size: 14px;
    }

    .loading {
      color: var(--green);
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 30px 20px;
      border-top: 1px solid #1d1d1d;
      background: #080808;
      color: #666;
      text-align: center;
      font-size: 11px;
      line-height: 1.7;
    }

    footer strong {
      color: var(--green);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding-top: 42px;
      }

      .logo {
        font-size: 31px;
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 9px;
      }

      .admin-link {
        top: 25px;
        right: 12px;
        font-size: 8px;
      }

      .menu-button {
        top: 13px;
        left: 12px;
        width: 36px;
        height: 36px;
      }

      main {
        padding: 25px 12px 45px;
      }

      .post {
        padding: 17px;
        border-radius: 15px;
      }

      .post-top {
        align-items: flex-start;
      }

      .match {
        font-size: 25px;
        margin: 22px 0;
      }

      .key-stat {
        padding: 15px;
      }

      .key-stat-player {
        font-size: 15px;
      }

      .key-stat-value {
        font-size: 21px;
      }

      .analysis {
        font-size: 13px;
        line-height: 1.65;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <button
      class="menu-button"
      onclick="toggleMenu()"
      aria-label="Ouvrir le menu">
      ☰
    </button>

    <a
      href="admin.html"
      class="admin-link">
      ESPACE ADMIN
    </a>

    <!-- MENU SPORTS -->

    <div
      class="sport-menu"
      id="sportMenu">

      <button
        class="active"
        onclick="filterSport('Toutes les analyses', this)">
        Toutes les analyses
      </button>

      <button
        onclick="filterSport('Football', this)">
        ⚽ Football
      </button>

      <button
        onclick="filterSport('Basketball', this)">
        🏀 Basketball
      </button>

      <button
        onclick="filterSport('Tennis', this)">
        🎾 Tennis
      </button>

      <button
        onclick="filterSport('Hockey', this)">
        🏒 Hockey
      </button>

      <button
        onclick="filterSport('Rugby', this)">
        🏉 Rugby
      </button>

    </div>

    <div class="logo">
      BETJOKER
    </div>

    <div class="subtitle">
      Analyses et statistiques sportives
    </div>

  </header>


  <!-- =========================
       CONTENU
  ========================= -->

  <main>

    <div
      class="section-title"
      id="sectionTitle">
      DERNIÈRES ANALYSES
    </div>

    <div
      class="posts"
      id="posts">

      <div class="message loading">
        Chargement des analyses...
      </div>

    </div>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>
    <strong>BETJOKER</strong> — Analyses et statistiques sportives
  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    /* =========================
       SUPABASE
    ========================= */

    const supabaseClient =
      window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
      );


    let allPosts = [];

    let currentSport =
      "Toutes les analyses";


    /* =========================
       MENU
    ========================= */

    function toggleMenu() {

      document
        .getElementById("sportMenu")
        .classList.toggle("active");

    }


    /* =========================
       SÉCURITÉ HTML
    ========================= */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       DATE
    ========================= */

    function formatDate(date) {

      if (!date) {
        return "";
      }

      const d =
        new Date(date + "T00:00:00");

      if (isNaN(d.getTime())) {
        return escapeHtml(date);
      }

      return d.toLocaleDateString(
        "fr-FR",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );

    }


    /* =========================
       STATUT
    ========================= */

    function getResultData(result) {

      if (result === "win") {

        return {
          className: "win",
          text: "RÉSULTAT CONFIRMÉ"
        };

      }

      if (result === "loss") {

        return {
          className: "loss",
          text: "RÉSULTAT NON CONFIRMÉ"
        };

      }

      return {
        className: "pending",
        text: "EN COURS"
      };

    }


    /* =========================
       CONFIANCE
    ========================= */

    function getConfidence(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return null;
      }

      const raw =
        String(value)
          .replace("%", "")
          .replace(",", ".")
          .trim();

      const number =
        parseFloat(raw);

      if (isNaN(number)) {
        return null;
      }

      return Math.max(
        0,
        Math.min(100, number)
      );

    }


    /* =========================
       AFFICHAGE DES ANALYSES
    ========================= */

    function displayPosts(posts) {

      const container =
        document.getElementById("posts");

      if (
        !posts ||
        posts.length === 0
      ) {

        container.innerHTML = `
          <div class="message">
            Aucune analyse disponible pour le moment.
          </div>
        `;

        return;
      }


      container.innerHTML =
        posts.map(post => {

          const sport =
            escapeHtml(post.sport);

          const match =
            escapeHtml(post.match);

          const title =
            escapeHtml(post.title);

          const analysis =
            escapeHtml(post.analysis);

          const category =
            escapeHtml(
              post.category || "ANALYSE"
            );

          const date =
            formatDate(post.date);


          /* STATUT */

          const result =
            post.result || "pending";

          const resultData =
            getResultData(result);


          /* CONFIANCE */

          const confidence =
            getConfidence(
              post.confidence
            );


          /*
            Les champs joueur/statistique
            sont optionnels.

            Si ces colonnes existent
            dans Supabase, elles seront
            automatiquement utilisées.
          */

          const player =
            escapeHtml(
              post.featured_player ||
              post.featuredPlayer ||
              ""
            );

          const team =
            escapeHtml(
              post.featured_team ||
              post.featuredTeam ||
              ""
            );

          const goals =
            escapeHtml(
              post.featured_goals ||
              post.featuredGoals ||
              ""
            );

          const assists =
            escapeHtml(
              post.featured_assists ||
              post.featuredAssists ||
              ""
            );

          const goalRatio =
            escapeHtml(
              post.featured_goal_ratio ||
              post.featuredGoalRatio ||
              ""
            );

          const decisiveRatio =
            escapeHtml(
              post.featured_decisive_ratio ||
              post.featuredDecisiveRatio ||
              ""
            );


          /*
            STAT CLÉ :
            priorité au ratio de buts,
            puis contribution décisive,
            puis buts/assistances.
          */

          let statValue = "";
          let statPlayer = player;

          if (goalRatio) {

            statValue =
              goalRatio;

          } else if (decisiveRatio) {

            statValue =
              decisiveRatio;

          } else if (goals || assists) {

            const parts = [];

            if (goals) {
              parts.push(
                goals + " but(s)"
              );
            }

            if (assists) {
              parts.push(
                assists + " passe(s)"
              );
            }

            statValue =
              parts.join(" · ");
          }


          if (
            !statPlayer &&
            team
          ) {
            statPlayer =
              team;
          }


          const hasKeyStat =
            statPlayer ||
            statValue;


          return `

            <article class="post">

              <!-- HAUT -->

              <div class="post-top">

                <div>

                  <div class="sport">
                    ${sport}
                  </div>

                  ${
                    date
                      ? `
                        <div class="date">
                          ${date}
                        </div>
                      `
                      : ""
                  }

                </div>


                <div
                  class="result ${resultData.className}">
                  ${resultData.text}
                </div>

              </div>


              <!-- MATCH -->

              <div class="match">
                ${match}
              </div>


              <!-- TITRE -->

              ${
                title
                  ? `
                    <div class="title">
                      ${title}
                    </div>
                  `
                  : ""
              }


              <!-- CATÉGORIE -->

              <div class="info">

                <span class="badge">
                  ${category}
                </span>

              </div>


              <!-- STAT CLÉ -->

              ${
                hasKeyStat
                  ? `

                    <div class="key-stat">

                      <div class="key-stat-left">

                        <div class="key-stat-label">
                          ⭐ STAT CLÉ
                        </div>

                        ${
                          statPlayer
                            ? `
                              <div class="key-stat-player">
                                ${statPlayer}
                              </div>
                            `
                            : ""
                        }

                        ${
                          team && statPlayer
