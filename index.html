<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOKER ANALYSIS</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}


/* =========================
   BOUTON MENU
========================= */

.menu-button {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 1000;

  width: 45px;
  height: 45px;

  background: #080808;
  color: #39ff14;

  border: 1px solid #39ff14;
  border-radius: 8px;

  font-size: 23px;
  cursor: pointer;
}


/* =========================
   MENU
========================= */

.menu {
  display: none;

  position: fixed;
  top: 68px;
  left: 15px;

  width: 220px;

  background: #0c0c0c;

  border: 1px solid #39ff14;
  border-radius: 10px;

  padding: 10px;

  z-index: 999;

  box-shadow: 0 0 20px rgba(57,255,20,0.2);
}

.menu.open {
  display: block;
}


.menu-title {
  color: #39ff14;
  font-size: 12px;
  font-weight: bold;

  padding: 8px;

  border-bottom: 1px solid #222;
}


.menu button {
  width: 100%;

  margin-top: 5px;

  padding: 11px;

  background: transparent;

  border: none;

  border-radius: 6px;

  color: #ddd;

  text-align: left;

  cursor: pointer;

  font-size: 14px;
}


.menu button:hover {
  background: #181818;
  color: #39ff14;
}


.menu button.active {
  background: #39ff14;
  color: black;
  font-weight: bold;
}


/* =========================
   ADMIN
========================= */

.admin-link {
  position: fixed;
  top: 17px;
  right: 15px;

  padding: 8px 11px;

  border: 1px solid #39ff14;
  border-radius: 7px;

  color: #39ff14;

  background: #050505;

  text-decoration: none;

  font-size: 11px;
  font-weight: bold;

  z-index: 1000;
}


/* =========================
   CONTENU
========================= */

main {
  max-width: 900px;

  margin: auto;

  padding: 85px 15px 40px;
}


header {
  text-align: center;

  margin-bottom: 30px;
}


h1 {
  margin: 0;

  color: #39ff14;

  font-size: 38px;

  letter-spacing: 3px;

  text-shadow: 0 0 12px rgba(57,255,20,0.4);
}


.subtitle {
  margin-top: 10px;

  color: #999;

  font-size: 14px;
}


.filter {
  display: inline-block;

  margin-top: 15px;

  padding: 7px 12px;

  border: 1px solid #292929;
  border-radius: 20px;

  color: #39ff14;

  font-size: 12px;
  font-weight: bold;
}


/* =========================
   POSTS
========================= */

#posts {
  display: flex;

  flex-direction: column;

  gap: 18px;
}


.post {
  background: #111;

  border: 1px solid #292929;

  border-radius: 12px;

  padding: 20px;
}


.post:hover {
  border-color: #39ff14;
}


.post-top {
  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

  flex-wrap: wrap;
}


.sport {
  color: #39ff14;

  font-size: 13px;

  font-weight: bold;

  text-transform: uppercase;
}


.category {
  color: #777;

  font-size: 11px;
}


.post h2 {
  margin: 12px 0 7px;

  font-size: 21px;
}


.match {
  color: #ccc;

  font-weight: bold;

  margin-bottom: 12px;
}


.date {
  color: #666;

  font-size: 12px;

  margin-bottom: 14px;
}


.analysis {
  color: #ddd;

  line-height: 1.6;

  white-space: pre-line;
}


.confidence {
  margin-top: 17px;

  padding: 10px;

  background: #090909;

  border-left: 3px solid #39ff14;

  color: #bbb;
}


.confidence strong {
  color: #39ff14;
}


/* =========================
   MESSAGES
========================= */

.message {
  text-align: center;

  padding: 40px 10px;

  color: #777;
}


.error {
  color: #ff4444;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

  main {
    padding-top: 75px;
  }

  h1 {
    font-size: 29px;
  }

  .post {
    padding: 16px;
  }

  .post h2 {
    font-size: 19px;
  }

}

</style>

</head>


<body>


<!-- =========================
     MENU
========================= -->

<button
  id="menuButton"
  class="menu-button">

  ☰

</button>


<div
  id="menu"
  class="menu">

  <div class="menu-title">
    CHOISIR UN SPORT
  </div>


  <button
    class="sport-button active"
    data-sport="all">

    🏆 Toutes les analyses

  </button>


  <button
    class="sport-button"
    data-sport="Football">

    ⚽ Football

  </button>


  <button
    class="sport-button"
    data-sport="Basketball">

    🏀 Basketball

  </button>


  <button
    class="sport-button"
    data-sport="Tennis">

    🎾 Tennis

  </button>


  <button
    class="sport-button"
    data-sport="Hockey">

    🏒 Hockey

  </button>


  <button
    class="sport-button"
    data-sport="Rugby">

    🏉 Rugby

  </button>

</div>


<!-- =========================
     ADMIN
========================= -->

<a
  href="admin.html"
  class="admin-link">

  ESPACE ADMIN

</a>


<!-- =========================
     CONTENU
========================= -->

<main>

<header>

  <h1>
    JOKER ANALYSIS
  </h1>

  <div class="subtitle">
    Analyses et statistiques sportives
  </div>

  <div
    id="filter"
    class="filter">

    TOUTES LES ANALYSES

  </div>

</header>


<section id="posts">

  <div class="message">
    Chargement des analyses...
  </div>

</section>

</main>


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

/* =========================
   SUPABASE
========================= */

const db = supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_ANON_KEY
);


/* =========================
   VARIABLES
========================= */

let posts = [];

let selectedSport = "all";


const menuButton =
  document.getElementById("menuButton");

const menu =
  document.getElementById("menu");

const postsContainer =
  document.getElementById("posts");

const filter =
  document.getElementById("filter");


/* =========================
   OUVRIR / FERMER MENU
========================= */

menuButton.onclick = function() {

  menu.classList.toggle("open");

};


/* =========================
   CHOISIR SPORT
========================= */

const buttons =
  document.querySelectorAll(".sport-button");


buttons.forEach(function(button) {

  button.onclick = function() {

    selectedSport =
      button.getAttribute("data-sport");


    buttons.forEach(function(btn) {

      btn.classList.remove("active");

    });


    button.classList.add("active");


    if(selectedSport === "all") {

      filter.textContent =
        "TOUTES LES ANALYSES";

    } else {

      filter.textContent =
        selectedSport.toUpperCase();

    }


    menu.classList.remove("open");


    displayPosts();

  };

});


/* =========================
   CHARGER SUPABASE
========================= */

async function loadPosts() {

  postsContainer.innerHTML = `
    <div class="message">
      Chargement des analyses...
    </div>
  `;


  const result =
    await db
      .from("posts")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if(result.error) {

    console.error(result.error);


    postsContainer.innerHTML = `
      <div class="message error">
        Impossible de charger les analyses.
      </div>
    `;

    return;

  }


  posts = result.data || [];


  displayPosts();

}


/* =========================
   AFFICHER
========================= */

function displayPosts() {

  let filtered;


  if(selectedSport === "all") {

    filtered = posts;

  } else {

    filtered = posts.filter(function(post) {

      return normalize(post.sport)
        === normalize(selectedSport);

    });

  }


  if(filtered.length === 0) {

    postsContainer.innerHTML = `
      <div class="message">
        Aucune analyse disponible pour ce sport.
      </div>
    `;

    return;

  }


  postsContainer.innerHTML = "";


  filtered.forEach(function(post) {


    const article =
      document.createElement("article");


    article.className = "post";


    let date = "";


    if(post.date) {

      const d =
        new Date(post.date + "T00:00:00");


      date =
        d.toLocaleDateString("fr-FR");

    }


    article.innerHTML = `

      <div class="post-top">

        <div class="sport">
          ${escapeHtml(post.sport)}
        </div>

        <div class="category">
          ${escapeHtml(
            post.category || "ANALYSE"
          )}
        </div>

      </div>


      <h2>
        ${escapeHtml(
          post.title || "Analyse sportive"
        )}
      </h2>


      <div class="match">
        ${escapeHtml(post.match)}
      </div>


      ${
        date
        ? `
          <div class="date">
            ${date}
          </div>
        `
        : ""
      }


      <div class="analysis">
        ${escapeHtml(post.analysis)}
      </div>


      ${
        post.confidence
        ? `
          <div class="confidence">

            <strong>
              Confiance :
            </strong>

            ${escapeHtml(post.confidence)}

          </div>
        `
        : ""
      }

    `;


    postsContainer.appendChild(article);

  });

}


/* =========================
   NORMALISATION SPORT
========================= */

function normalize(value) {

  return String(value || "")
    .trim()
    .toLowerCase();

}


/* =========================
   SÉCURITÉ HTML
========================= */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   LANCER
========================= */

loadPosts();

</script>


</body>

</html>
