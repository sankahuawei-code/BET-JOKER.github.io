<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BETJOKER — Analyses sportives</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #39ff14;
      --green-soft: rgba(57,255,20,0.12);
      --black: #050505;
      --text: #fff;
      --muted: #8a8a8a;
    }

    body {
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(57,255,20,0.07),
          transparent 35%
        ),
        #050505;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    header {
      position: relative;
      text-align: center;
      padding: 34px 20px 25px;
      border-bottom: 1px solid rgba(57,255,20,0.22);
      background: rgba(5,5,5,0.96);
    }

    .menu-button {
      position: absolute;
      top: 17px;
      left: 18px;
      width: 40px;
      height: 40px;
      background: transparent;
      border: 1px solid #242424;
      border-radius: 8px;
      color: var(--green);
      font-size: 22px;
      cursor: pointer;
    }

    .menu-button:hover {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .admin-link {
      position: absolute;
      top: 27px;
      right: 18px;
      color: #666;
      text-decoration: none;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.2px;
    }

    .admin-link:hover {
      color: var(--green);
    }

    .logo {
      color: var(--green);
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 5px;
      text-shadow:
        0 0 6px var(--green),
        0 0 18px rgba(57,255,20,0.45);
    }

    .subtitle {
      margin-top: 8px;
      color: #999;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .sport-menu {
      display: none;
      position: absolute;
      z-index: 100;
      top: 65px;
      left: 15px;
      width: 225px;
      background: #0a0a0a;
      border: 1px solid var(--green);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(57,255,20,0.15);
    }

    .sport-menu.active {
      display: block;
    }

    .sport-menu button {
      width: 100%;
      padding: 14px 16px;
      border: 0;
      border-bottom: 1px solid #1b1b1b;
      background: transparent;
      color: #ccc;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
    }

    .sport-menu button:last-child {
      border-bottom: 0;
    }

    .sport-menu button:hover,
    .sport-menu button.active {
      color: var(--green);
      background: var(--green-soft);
    }

    main {
      width: 100%;
      max-width: 920px;
      margin: auto;
      padding: 32px 15px 60px;
    }

    .section-title {
      margin-bottom: 22px;
      color: var(--green);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .posts {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .post {
      position: relative;
      overflow: hidden;
      padding: 23px;
      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(57,255,20,0.08),
          transparent 32%
        ),
        linear-gradient(145deg,#101010,#070707);
      border: 1px solid #242424;
      border-left: 4px solid var(--green);
      border-radius: 18px;
      box-shadow:
        0 0 25px rgba(0,0,0,0.55),
        inset 0 0 30px rgba(57,255,20,0.025);
      transition: 0.25s ease;
    }

    .post:hover {
      transform: translateY(-2px);
      border-color: rgba(57,255,20,0.55);
    }

    .post-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .sport {
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .date {
      color: #666;
      font-size: 10px;
      margin-top: 5px;
    }

    .result {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .8px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .result.pending {
      color: #fff;
      background: #171717;
      border: 1px solid #343434;
    }

    .result.win {
      color: var(--green);
      background: rgba(57,255,20,.09);
      border: 1px solid rgba(57,255,20,.35);
    }

    .result.loss {
      color: #ff5c5c;
      background: rgba(255,75,75,.08);
      border: 1px solid rgba(255,75,75,.35);
    }

    .match {
      margin: 25px 0 17px;
      text-align: center;
      font-size: clamp(24px,5vw,39px);
      font-weight: 900;
      line-height: 1.1;
    }

    .title {
      margin-bottom: 17px;
      color: var(--green);
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .badge {
      padding: 7px 10px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 7px;
      color: #999;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .confidence {
      margin: 18px 0;
      padding: 14px;
      background: #0d0d0d;
      border: 1px solid #222;
      border-radius: 10px;
    }

    .confidence-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      color: #aaa;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .confidence-bar {
      width: 100%;
      height: 7px;
      overflow: hidden;
      background: #1a1a1a;
      border-radius: 20px;
    }

    .confidence-fill {
      height: 100%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(57,255,20,.6);
      border-radius: 20px;
    }

    .analysis {
      margin-top: 15px;
      padding: 17px;
      background: rgba(255,255,255,.025);
      border-left: 2px solid var(--green);
      border-radius: 8px;
      color: #ccc;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .key-player {
      margin: 17px 0;
      padding: 16px;
      background: linear-gradient(
        135deg,
        rgba(57,255,20,.07),
        rgba(57,255,20,.015)
      );
      border: 1px solid rgba(57,255,20,.2);
      border-radius: 12px;
    }

    .key-player-title {
      margin-bottom: 10px;
      color: var(--green);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .player-name {
      color: #fff;
      font-size: 18px;
      font-weight: 900;
    }

    .player-team {
      margin-top: 4px;
      color: #777;
      font-size: 11px;
    }

    .player-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .player-stat {
      padding: 7px 9px;
      background: #0b0b0b;
      border: 1px solid #262626;
      border-radius: 7px;
      color: #aaa;
      font-size: 10px;
    }

    .empty {
      padding: 55px 20px;
      text-align: center;
      color: #666;
      border: 1px dashed #292929;
      border-radius: 15px;
    }

    .loading {
      padding: 40px;
      text-align: center;
      color: var(--green);
    }

    footer {
      padding: 25px 15px 35px;
      text-align: center;
      color: #555;
      font-size: 10px;
      line-height: 1.6;
      border-top: 1px solid #171717;
    }

    @media(max-width:600px) {
      .logo {
        font-size: 30px;
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 9px;
      }

      .post {
        padding: 18px;
      }

      .post-top {
        align-items: flex-start;
      }

      .result {
        font-size: 8px;
        padding: 7px 9px;
      }
    }
  </style>
</head>

<body>

<header>

  <button class="menu-button" id="menuButton">☰</button>

  <a class="admin-link" href="admin.html">
    ESPACE ADMIN
  </a>

  <div class="sport-menu" id="sportMenu">

    <button class="active" data-sport="all">
      Toutes les analyses
    </button>

    <button data-sport="Football">
      Football
    </button>

    <button data-sport="Basketball">
      Basketball
    </button>

    <button data-sport="Tennis">
      Tennis
    </button>

    <button data-sport="Hockey">
      Hockey
    </button>

    <button data-sport="Rugby">
      Rugby
    </button>

  </div>

  <div class="logo">BETJOKER</div>

  <div class="subtitle">
    Analyses et statistiques sportives
  </div>

</header>

<main>

  <div class="section-title">
    ANALYSES SPORTIVES
  </div>

  <div id="posts" class="posts">
    <div class="loading">
      Chargement des analyses...
    </div>
  </div>

</main>

<footer>
  BETJOKER — Analyses et statistiques sportives
</footer>

<script>

  let allPosts = [];
  let currentSport = "all";

  const menuButton = document.getElementById("menuButton");
  const sportMenu = document.getElementById("sportMenu");
  const postsContainer = document.getElementById("posts");

  menuButton.addEventListener("click", function(event) {
    event.stopPropagation();
    sportMenu.classList.toggle("active");
  });

  document.addEventListener("click", function(event) {
    if (!sportMenu.contains(event.target) &&
        event.target !== menuButton) {
      sportMenu.classList.remove("active");
    }
  });

  document.querySelectorAll(".sport-menu button").forEach(button => {

    button.addEventListener("click", function() {

      document.querySelectorAll(".sport-menu button")
        .forEach(btn => btn.classList.remove("active"));

      this.classList.add("active");

      currentSport = this.dataset.sport;

      sportMenu.classList.remove("active");

      displayPosts();

    });

  });

  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(date) {

    if (!date) return "";

    const d = new Date(date);

    if (isNaN(d.getTime())) {
      return escapeHtml(date);
    }

    return d.toLocaleDateString("fr-FR", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    });
  }

  function getResultData(result) {

    if (result === "win") {
      return {
        className: "win",
        text: "CONFIRMÉ"
      };
    }

    if (result === "loss") {
      return {
        className: "loss",
        text: "NON CONFIRMÉ"
      };
    }

    return {
      className: "pending",
      text: "EN COURS"
    };
  }

  function getConfidence(value) {

    if (value === null || value === undefined) {
      return null;
    }

    let number = parseInt(
      String(value).replace("%",""),
      10
    );

    if (isNaN(number)) {
      return null;
    }

    number = Math.max(0, Math.min(100, number));

    return number;
  }

  function displayPosts() {

    let posts = allPosts;

    if (currentSport !== "all") {

      posts = allPosts.filter(post =>
        String(post.sport || "").toLowerCase() ===
        currentSport.toLowerCase()
      );

    }

    if (!posts.length) {

      postsContainer.innerHTML = `
        <div class="empty">
          Aucune analyse publiée pour le moment.
        </div>
      `;

      return;
    }

    postsContainer.innerHTML = posts.map(post => {

      const result = getResultData(post.result);

      const confidence = getConfidence(post.confidence);

      const featuredPlayer =
        post.featured_player ||
        post.featuredPlayer ||
        "";

      const featuredTeam =
        post.featured_team ||
        post.featuredTeam ||
        "";

      const goals =
        post.featured_goals ??
        post.featuredGoals;

      const assists =
        post.featured_assists ??
        post.featuredAssists;

      const goalRatio =
        post.featured_goal_ratio ??
        post.featuredGoalRatio;

      const decisiveRatio =
        post.featured_decisive_ratio ??
        post.featuredDecisiveRatio;

      let playerHtml = "";

      if (featuredPlayer) {

        let stats = "";

        if (goals !== null &&
            goals !== undefined &&
            goals !== "") {

          stats += `
            <div class="player-stat">
              ⚽ ${escapeHtml(goals)} but(s)
            </div>
          `;
        }

        if (assists !== null &&
            assists !== undefined &&
            assists !== "") {

          stats += `
            <div class="player-stat">
              🎯 ${escapeHtml(assists)} passe(s)
            </div>
          `;
        }

        if (goalRatio) {

          stats += `
            <div class="player-stat">
              ⚡ ${escapeHtml(goalRatio)}
            </div>
          `;
        }

        if (decisiveRatio) {

          stats += `
            <div class="player-stat">
              🔥 ${escapeHtml(decisiveRatio)}
            </div>
          `;
        }

        playerHtml = `
          <div class="key-player">

            <div class="key-player-title">
              ⭐ JOUEUR À SUIVRE
            </div>

            <div class="player-name">
              ${escapeHtml(featuredPlayer)}
            </div>

            ${
              featuredTeam
                ? `
                  <div class="player-team">
                    ${escapeHtml(featuredTeam)}
                  </div>
                `
                : ""
            }

            ${
              stats
                ? `
                  <div class="player-stats">
                    ${stats}
                  </div>
                `
                : ""
            }

          </div>
        `;

      }

      return `
        <article class="post">

          <div class="post-top">

            <div>

              <div class="sport">
                ${escapeHtml(post.sport || "SPORT")}
              </div>

              ${
                post.date
                  ? `
                    <div class="date">
                      ${formatDate(post.date)}
                    </div>
                  `
                  : ""
              }

            </div>

            <div class="result ${result.className}">
              ${result.text}
            </div>

          </div>

          <div class="match">
            ${escapeHtml(post.match || "")}
          </div>

          ${
            post.title
              ? `
                <div class="title">
                  ${escapeHtml(post.title)}
                </div>
              `
              : ""
          }

          <div class="info">

            ${
              post.category
                ? `
                  <div class="badge">
                    ${escapeHtml(post.category)}
                  </div>
                `
                : ""
            }

          </div>

          ${
            confidence !== null
              ? `
                <div class="confidence">

                  <div class="confidence-top">

                    <span>
                      Niveau de confiance
                    </span>

                    <span>
                      ${confidence}%
                    </span>

                  </div>

                  <div class="confidence-bar">

                    <div
                      class="confidence-fill"
                      style="width:${confidence}%"
                    ></div>

                  </div>

                </div>
              `
              : ""
          }

          ${playerHtml}

          <div class="analysis">
            ${escapeHtml(post.analysis || "")}
          </div>

        </article>
      `;

    }).join("");

  }

  async function loadPosts() {

    try {

      if (
        typeof window.SUPABASE_URL === "undefined" ||
        typeof window.SUPABASE_ANON_KEY === "undefined"
      ) {

        postsContainer.innerHTML = `
          <div class="empty">
            Configuration Supabase introuvable.
          </div>
        `;

        return;
      }

      const supabaseClient =
        window.supabase.createClient(
          window.SUPABASE_URL,
          window.SUPABASE_ANON_KEY
        );

      const { data, error } =
        await supabaseClient
          .from("posts")
          .select("*")
          .order("created_at", {
            ascending: false
          });

      if (error) {
        console.error(error);

        postsContainer.innerHTML = `
          <div class="empty">
            Impossible de charger les analyses.
          </div>
        `;

        return;
      }

      allPosts = data || [];

      displayPosts();

    } catch (error) {

      console.error(error);

      postsContainer.innerHTML = `
        <div class="empty">
          Une erreur est survenue lors du chargement.
        </div>
      `;

    }

  }

  loadPosts();

</script>

</body>
</html>
