<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JOKER ANALYSIS</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial, sans-serif;
}

/* ===== BOUTON ESPACE ADMIN ===== */

.admin-link{
  position:fixed;
  top:16px;
  right:16px;
  z-index:1000;

  padding:8px 12px;

  border:1px solid #39ff14;
  border-radius:8px;

  color:#39ff14;
  background:rgba(0,0,0,.85);

  text-decoration:none;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;

  box-shadow:0 0 8px rgba(57,255,20,.25);

  transition:.2s;
}

.admin-link:hover{
  background:#39ff14;
  color:#000;
  box-shadow:0 0 18px rgba(57,255,20,.7);
}

/* ===== CONTENU ===== */

main{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:70px 15px 40px;
}

header{
  text-align:center;
  margin-bottom:35px;
}

h1{
  margin:0;
  color:#39ff14;
  font-size:38px;
  letter-spacing:3px;
  text-shadow:0 0 12px rgba(57,255,20,.5);
}

.subtitle{
  margin-top:10px;
  color:#aaa;
  font-size:15px;
}

/* ===== ANALYSES ===== */

#posts{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.post{
  background:#111;
  border:1px solid #292929;
  border-radius:12px;
  padding:20px;

  box-shadow:0 0 10px rgba(0,0,0,.4);
}

.post:hover{
  border-color:#39ff14;
  box-shadow:0 0 15px rgba(57,255,20,.12);
}

.post-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.sport{
  color:#39ff14;
  font-weight:bold;
  font-size:14px;
  text-transform:uppercase;
}

.category{
  color:#888;
  font-size:12px;
}

.post h2{
  margin:12px 0 6px;
  font-size:22px;
}

.match{
  color:#ccc;
  font-weight:bold;
  margin-bottom:15px;
}

.date{
  color:#777;
  font-size:13px;
  margin-bottom:15px;
}

.analysis{
  color:#ddd;
  line-height:1.6;
  white-space:pre-line;
}

.confidence{
  margin-top:18px;
  padding:10px;

  border-left:3px solid #39ff14;

  background:#0b0b0b;
  color:#bbb;
}

.empty{
  text-align:center;
  color:#777;
  padding:40px 10px;
}

.error{
  text-align:center;
  color:#ff4444;
  padding:30px 10px;
}

/* ===== MOBILE ===== */

@media(max-width:600px){

  .admin-link{
    top:10px;
    right:10px;
    font-size:11px;
    padding:7px 9px;
  }

  main{
    padding-top:65px;
  }

  h1{
    font-size:30px;
  }

  .post h2{
    font-size:19px;
  }

}

</style>
</head>


<body>

<!-- ESPACE ADMIN -->

<a href="admin.html" class="admin-link">
  ESPACE ADMIN
</a>


<main>

<header>

<h1>JOKER ANALYSIS</h1>

<div class="subtitle">
Analyses et statistiques sportives
</div>

</header>


<section id="posts">

<div class="empty">
Chargement des analyses...
</div>

</section>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

const db = supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_ANON_KEY
);


async function loadPosts(){

  const container = document.getElementById("posts");

  container.innerHTML = `
    <div class="empty">
      Chargement des analyses...
    </div>
  `;


  const { data, error } = await db
    .from("posts")
    .select("*")
    .order("created_at", {
      ascending:false
    });


  if(error){

    container.innerHTML = `
      <div class="error">
        Impossible de charger les analyses.
      </div>
    `;

    console.error(error);

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML = `
      <div class="empty">
        Aucune analyse publiée pour le moment.
      </div>
    `;

    return;
  }


  container.innerHTML = "";


  data.forEach(post => {

    const article = document.createElement("article");

    article.className = "post";


    const date = post.date
      ? new Date(post.date).toLocaleDateString("fr-FR")
      : "";


    article.innerHTML = `

      <div class="post-header">

        <div class="sport">
          ${escapeHtml(post.sport || "")}
        </div>

        <div class="category">
          ${escapeHtml(post.category || "ANALYSE")}
        </div>

      </div>


      <h2>
        ${escapeHtml(post.title || "Analyse sportive")}
      </h2>


      <div class="match">
        ${escapeHtml(post.match || "")}
      </div>


      ${
        date
        ? `<div class="date">${date}</div>`
        : ""
      }


      <div class="analysis">
        ${escapeHtml(post.analysis || "")}
      </div>


      ${
        post.confidence
        ? `
          <div class="confidence">
            <strong>Confiance :</strong>
            ${escapeHtml(post.confidence)}
          </div>
        `
        : ""
      }

    `;


    container.appendChild(article);

  });

}


function escapeHtml(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


loadPosts();

</script>

</body>
</html>
