<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOKER ANALYSIS</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050505;
  color:#eee;
  font-family:Arial,sans-serif;
}

header{
  padding:25px 15px;
  text-align:center;
  border-bottom:1px solid #39ff14;
}

h1{
  margin:0;
  color:#39ff14;
  font-size:34px;
}

header p{
  color:#aaa;
}

main{
  max-width:900px;
  margin:25px auto;
  padding:0 15px;
}

.post{
  background:#101010;
  border:1px solid #222;
  border-left:4px solid #39ff14;
  border-radius:10px;
  padding:18px;
  margin-bottom:16px;
}

.meta{
  color:#39ff14;
  font-weight:bold;
}

.date{
  color:#888;
  font-size:13px;
}

.title{
  font-size:22px;
  font-weight:bold;
  margin:8px 0;
}

.analysis{
  white-space:pre-wrap;
  line-height:1.5;
}

.empty{
  text-align:center;
  color:#888;
  padding:40px;
}

.admin{
  display:block;
  text-align:center;
  margin:25px;
  color:#39ff14;
}
</style>
</head>

<body>

<header>
  <h1>JOKER ANALYSIS</h1>
  <p>Analyses et statistiques sportives</p>
</header>

<main id="posts">
  <div class="empty">Chargement...</div>
</main>

<a class="admin" href="admin.html">ESPACE ADMIN</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
const sb = supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_ANON_KEY
);

async function load(){

  const box = document.getElementById('posts');

  const {data,error} = await sb
    .from('posts')
    .select('*')
    .order('created_at',{ascending:false});

  if(error){
    box.innerHTML =
      '<div class="empty">Erreur de chargement.</div>';
    return;
  }

  if(!data.length){
    box.innerHTML =
      '<div class="empty">Aucune analyse publiée pour le moment.</div>';
    return;
  }

  box.innerHTML = data.map(p => `
    <article class="post">

      <div class="meta">
        ${esc(p.sport)} — ${esc(p.match)}
      </div>

      <div class="date">
        ${p.date ? esc(p.date) : ''}
      </div>

      ${p.title ? `
        <div class="title">
          ${esc(p.title)}
        </div>
      ` : ''}

      <div class="analysis">
        ${esc(p.analysis)}
      </div>

    </article>
  `).join('');
}

function esc(s){
  return String(s ?? '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );
}

load();
</script>

</body>
</html>
